<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Postcard</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>
<body>
    <h1>Instagram Postcard</h1>

    <div class="card">
        <div class="header-card">
            <div class="user">
                <i class="fa-brands fa-html5 user-icon"></i>
                <div class="user-info">
                    <strong>HTML5</strong>
                    <span>Rigoberto</span>
                </div>
            </div>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>

        <div class="image">
            <img src="./image/perro.jpg" alt="Dog postcard image">
        </div>

        <div class="content-card">
            <div class="actions">
                <div class="left-icons">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <i class="fa-regular fa-bookmark"></i>
            </div>

            <p>Liked by <strong>4GeeksAcademy</strong>, <strong>html5</strong>, <strong>Web</strong> and <strong>100,000 others</strong></p>

            <p>
                This is my first Instagram postcard built with HTML and CSS.
                I am practicing structure, spacing, icons, and styling to recreate
                a simple social media post layout.
            </p>
        </div>
    </div>
</body>
</html>
